name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint-and-type-check:
    name: Lint and Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check TypeScript types
        run: bun run check-types

      # Lint and format are advisory for this manually-released fork: they run
      # and surface issues but do not fail the build. The hard gates are
      # type-check (above) and the VSIX build (below). This avoids failing CI on
      # cosmetic style drift -- especially Windows CRLF normalization churn --
      # while keeping the checks visible.
      - name: Run ESLint
        run: bun run lint
        continue-on-error: true

      - name: Check code formatting
        run: bun run format:check
        continue-on-error: true

      - name: Build the package
        run: bun run vsce:package
