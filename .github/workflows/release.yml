name: release
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# This fork is distributed as a VSIX via GitHub Releases, NOT the VS Code
# Marketplace. The Marketplace rejects both proposed-API extensions and
# `-fork.N` prerelease versions, so there is no `vsce publish` step here.
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun install --frozen-lockfile
      - run: bun run compile

      - name: Package VSIX
        run: bunx @vscode/vsce package --no-dependencies -o extension.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: vsix
          path: extension.vsix

      - name: Attach VSIX to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "${GITHUB_REF_NAME}" extension.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}
